<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SQLWeb 离线控制台</title>
<style>
  :root{
    /* 中性阶：纯中性冷灰，不带色味 */
    --page:#F4F5F7; --bg:#FFFFFF; --panel-2:#F7F8FA;
    --border:rgba(17,19,24,.09); --border-s:rgba(17,19,24,.16);
    --ink:#101216; --ink2:#474D55; --muted:#7A828B;
    /* 唯一强调色：电蓝 */
    --brand:#3A5CFF; --brand-soft:rgba(58,92,255,.09); --brand-ink:#2743D6;
    --ok:#1F9254; --ok-soft:rgba(31,146,84,.10); --ok-ink:#157A44;
    --warn:#C28A00; --warn-soft:rgba(194,138,0,.12); --warn-ink:#8A6100;
    --danger:#E5484D; --danger-soft:rgba(229,72,77,.10); --danger-ink:#B02A2E;
    /* 编辑器深色：工作台唯一的暗面 */
    --ed-bg:#0F1319; --ed-bar:#12181F; --ed-gutter:#0B0E13;
    --ed-ink:#E6EAF0; --ed-dim:#5D666F; --ed-kw:#7C9CFF;
    /* 圆角四角色 */
    --r-shell:14px; --r-card:8px; --r-ctrl:5px; --r-pill:999px;
    --sh-pop:0 2px 4px rgba(15,19,26,.05), 0 10px 24px -8px rgba(15,19,26,.12);
    --sh-modal:0 4px 10px rgba(15,19,26,.07), 0 24px 56px -12px rgba(15,19,26,.18),
               0 64px 120px -40px rgba(15,19,26,.22);
    --fm:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --bar:52px;
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
    "Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:13.5px; color:var(--ink2); background:var(--page);
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .num,.mono{font-family:var(--fm); font-variant-numeric:tabular-nums}

  /* ---------- 顶栏：数据源 / 当前库 两个下拉 ---------- */
  header{
    height:var(--bar); flex:none; display:flex; align-items:center; gap:14px;
    padding:0 20px; background:var(--bg); color:var(--ink);
    border-bottom:1px solid var(--border); z-index:20;
  }
  header .logo{font-weight:700; font-size:15px; letter-spacing:-.015em;
    white-space:nowrap; display:flex; align-items:center; gap:9px}
  header .logo .sq{
    width:24px; height:24px; border-radius:6px; background:var(--brand); color:#fff;
    display:grid; place-items:center; font-family:var(--fm); font-size:9.5px;
    font-weight:700; letter-spacing:.05em; flex:none;
  }
  header .ver{font-size:11px; color:var(--muted); white-space:nowrap;
    font-family:var(--fm); letter-spacing:.03em}
  header .grow{flex:1}
  .picks{display:flex; align-items:center; gap:9px; min-width:0}
  .picks .plb{font-size:11.5px; color:var(--muted); white-space:nowrap; letter-spacing:.02em}
  .picks .pdiv{width:1px; height:18px; background:var(--border-s); flex:none; margin:0 4px}
  .picks select{
    height:30px; min-width:110px; border-radius:var(--r-card);
    border:1px solid var(--border-s);
    background:var(--bg); color:var(--ink); padding:0 26px 0 9px; font-size:12.5px;
    outline:none; max-width:230px; font-family:var(--fm); cursor:pointer;
    appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%237A828B' stroke-width='1.4' fill='none' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat; background-position:right 9px center;
  }
  .picks select:focus{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
  .picks select:disabled{opacity:.45; cursor:not-allowed}
  header .who{font-size:12px; color:var(--muted); white-space:nowrap}
  .hbtn{
    height:30px; padding:0 12px; border-radius:var(--r-card);
    border:1px solid var(--border-s); background:var(--bg); color:var(--ink2);
    font-size:12.5px; cursor:pointer; font-family:inherit; white-space:nowrap;
    transition:border-color .12s,color .12s,background .12s;
  }
  .hbtn:hover{background:var(--panel-2); border-color:var(--brand); color:var(--brand-ink)}
  .hbtn.primary{background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600}
  .hbtn.primary:hover{background:#2B49E6; color:#fff}

  /* ---------- 主体 ---------- */
  main{flex:1; display:flex; min-height:0}
  aside{
    width:248px; flex:none; background:var(--bg); color:var(--ink2);
    display:flex; flex-direction:column; min-height:0;
    border-right:1px solid var(--border);
  }
  aside .asec{
    padding:9px 14px 8px; font-size:11.5px; color:var(--muted); letter-spacing:.04em;
    border-bottom:1px solid var(--border); flex:none;
    display:flex; align-items:center; justify-content:space-between;
  }
  aside .asec .cnt{font-family:var(--fm); color:var(--ink2); margin-left:6px}
  aside .asec .mini{
    font-size:11px; color:var(--muted); cursor:pointer; letter-spacing:0;
    padding:2px 6px; border-radius:var(--r-ctrl);
  }
  aside .asec .mini:hover{background:var(--panel-2); color:var(--brand-ink)}
  .tree{flex:1; overflow:auto; padding:6px 0 20px}
  .tree::-webkit-scrollbar{width:8px}
  .tree::-webkit-scrollbar-thumb{background:#DCDFE5; border-radius:4px}
  .tree::-webkit-scrollbar-thumb:hover{background:#C6CAD2}
  .tnode{
    padding:6px 14px; cursor:pointer; display:flex; align-items:center;
    gap:8px; font-size:12.8px; line-height:1.5; user-select:none;
    color:var(--ink2); border-radius:0;
  }
  .tnode:hover{background:var(--panel-2)}
  .tnode.active{background:var(--brand-soft); color:var(--brand-ink)}
  .tnode .ic{width:13px; flex:none; color:var(--muted); font-size:10px; text-align:center}
  .tnode .ic.ic-db{color:var(--brand)}
  .tnode .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1}
  .tnode .nm.mono{font-family:var(--fm); font-size:12.2px}
  .tnode .cnt{font-size:10.5px; color:var(--muted); font-family:var(--fm)}
  .tnode.depth1{padding-left:14px}
  .tnode.depth2{padding-left:28px; font-size:12.4px}
  .tnode.depth3{padding-left:42px; font-size:12.2px}
  .treeload{padding:8px 16px; font-size:11.5px; color:var(--muted); line-height:1.7}
  .treeload.bad{color:var(--danger-ink)}
  .treefoot{flex:none; padding:8px 14px; border-top:1px solid var(--border);
    font-size:11px; color:var(--muted); font-family:var(--fm);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  /* ---------- 工作区 ---------- */
  section.ws{flex:1; display:flex; flex-direction:column; min-width:0; background:var(--page)}
  .bar{
    flex:none; display:flex; align-items:center; gap:8px; padding:8px 16px;
    background:var(--bg); border-bottom:1px solid var(--border);
  }
  .bar .dbref{
    font-size:11.5px; padding:2px 9px 2px 8px; border-radius:var(--r-ctrl);
    background:var(--panel-2); color:var(--ink2); white-space:nowrap;
    font-family:var(--fm); display:flex; align-items:center; gap:6px;
  }
  .bar .dbref::before{content:"▤"; color:var(--brand); font-size:10px}
  .bar .tag{
    font-size:11px; padding:2px 8px; border-radius:var(--r-pill); background:var(--brand-soft);
    color:var(--brand-ink); border:1px solid transparent; white-space:nowrap;
  }
  .bar .tag.ro{background:var(--ok-soft); color:var(--ok-ink)}
  .bar .tag.rw{background:var(--danger-soft); color:var(--danger-ink)}
  .bar .grow{flex:1}
  .btn{
    height:30px; padding:0 13px; border-radius:var(--r-card); border:1px solid var(--border-s);
    background:var(--bg); color:var(--ink2); font-size:12.5px; cursor:pointer;
    font-family:inherit; white-space:nowrap; transition:border-color .12s,color .12s;
  }
  .btn:hover{background:var(--panel-2); border-color:var(--brand); color:var(--brand-ink)}
  .btn.run{background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600}
  .btn.run:hover{background:#2B49E6; color:#fff}
  .btn:disabled{opacity:.5; cursor:not-allowed}

  /* 编辑器：工作台唯一的暗面 */
  .editor{flex:none; height:38%; min-height:120px; display:flex; flex-direction:column;
    background:var(--ed-bg)}
  .editor textarea{
    flex:1; width:100%; border:0; outline:none; resize:none; padding:14px 18px;
    font-family:var(--fm); font-size:13px; line-height:1.8; color:var(--ed-ink);
    tab-size:2; background:var(--ed-bg); caret-color:var(--brand);
  }
  .editor textarea::placeholder{color:var(--ed-dim)}
  .editor textarea::selection{background:rgba(58,92,255,.32)}
  .splitter{
    height:5px; flex:none; background:var(--border); cursor:row-resize;
    border:0; transition:background .12s;
  }
  .splitter:hover{background:var(--brand)}

  .result{flex:1; display:flex; flex-direction:column; min-height:0; background:var(--bg)}
  .rhead{
    flex:none; display:flex; align-items:center; gap:10px; padding:7px 16px;
    border-bottom:1px solid var(--border); font-size:12px; color:var(--muted);
    background:var(--bg); min-height:38px;
  }
  .rhead .stat{white-space:nowrap; font-family:var(--fm); font-size:11.5px}
  .rhead .stat b{color:var(--ink); font-weight:600; font-size:13px}
  .rhead .grow{flex:1}
  .rhead .vline{width:1px; height:13px; background:var(--border-s); flex:none}
  .rbody{flex:1; overflow:auto; min-height:0}
  .rbody::-webkit-scrollbar{width:10px; height:10px}
  .rbody::-webkit-scrollbar-thumb{background:#DCDFE5; border-radius:5px}
  .rbody::-webkit-scrollbar-thumb:hover{background:#C6CAD2}

  table.grid{border-collapse:collapse; font-size:12.5px; min-width:100%;}
  table.grid th{
    position:sticky; top:0; background:var(--panel-2); z-index:2;
    padding:0 16px; height:36px; text-align:left; font-weight:600; color:var(--ink);
    border-bottom:1px solid var(--border); white-space:nowrap;
    font-family:var(--fm); font-size:11.5px; letter-spacing:.02em;
  }
  table.grid td{
    padding:0 16px; height:40px; border-bottom:1px solid var(--border);
    white-space:nowrap; max-width:420px; overflow:hidden; text-overflow:ellipsis;
    font-family:var(--fm); font-size:12.5px; color:var(--ink2);
    font-variant-numeric:tabular-nums;
  }
  table.grid td.num{text-align:right; color:var(--brand-ink); position:relative}
  table.grid td.num.qty::after{
    content:""; position:absolute; left:16px; right:16px; bottom:7px; height:2px;
    width:var(--w,0); max-width:calc(100% - 32px); background:rgba(58,92,255,.22);
    border-radius:2px; pointer-events:none;
  }
  table.grid td.null{color:var(--muted); font-style:italic}
  table.grid td.rownum{
    position:sticky; left:0; background:var(--panel-2); color:var(--muted); text-align:right;
    min-width:46px; border-right:1px solid var(--border); z-index:1;
  }
  table.grid tbody tr:hover td{background:var(--panel-2)}
  table.grid tbody tr:hover td.rownum{background:#F1F3F6}

  .empty{
    height:100%; display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:13px; flex-direction:column; gap:8px; padding:30px;
    text-align:center; line-height:1.8;
  }
  .errbox{
    margin:16px; padding:12px 14px; border-radius:var(--r-card); background:var(--danger-soft);
    border:1px solid rgba(229,72,77,.24); color:var(--danger-ink); font-size:12.5px;
    line-height:1.7; font-family:var(--fm); white-space:pre-wrap;
    word-break:break-word;
  }
  .infobox{
    margin:16px; padding:12px 14px; border-radius:var(--r-card); background:var(--ok-soft);
    border:1px solid rgba(31,146,84,.22); color:var(--ok-ink); font-size:12.5px; line-height:1.7;
  }

  /* ---------- 弹窗 ---------- */
  .modal{
    position:fixed; inset:0; background:rgba(15,19,26,.42); display:none;
    align-items:center; justify-content:center; z-index:60; padding:20px;
    backdrop-filter:blur(2px);
  }
  .modal.show{display:flex}
  .modal .box{
    background:var(--bg); border-radius:var(--r-shell); width:100%; max-width:780px;
    max-height:88vh; display:flex; flex-direction:column;
    box-shadow:var(--sh-modal); border:1px solid var(--border);
  }
  .modal .mhead{
    flex:none; display:flex; align-items:center; padding:15px 20px;
    border-bottom:1px solid var(--border); gap:10px;
  }
  .modal .mhead h3{margin:0; font-size:15px; font-weight:650; color:var(--ink);
    letter-spacing:-.01em}
  .modal .mhead .grow{flex:1}
  .modal .mhead .x{
    width:28px; height:28px; border:0; background:transparent; cursor:pointer;
    font-size:18px; color:var(--muted); border-radius:var(--r-ctrl); line-height:1;
  }
  .modal .mhead .x:hover{background:var(--panel-2); color:var(--ink)}
  .modal .mbody{flex:1; overflow:auto; padding:18px 20px; min-height:0}
  .modal .mfoot{
    flex:none; padding:12px 20px; border-top:1px solid var(--border);
    display:flex; gap:8px; justify-content:flex-end; background:var(--bg);
    border-radius:0 0 var(--r-shell) var(--r-shell);
  }

  .dslist{border:1px solid var(--border); border-radius:var(--r-card); overflow:hidden}
  .dsrow{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    border-bottom:1px solid var(--border); font-size:12.5px;
  }
  .dsrow:last-child{border-bottom:0}
  .dsrow .nm{font-weight:600; color:var(--ink); min-width:110px; font-family:var(--fm)}
  .dsrow .badge{
    font-size:10.5px; padding:2px 8px; border-radius:var(--r-pill);
    background:var(--brand-soft); color:var(--brand-ink); white-space:nowrap;
    font-family:var(--fm);
  }
  .dsrow .badge.ro{background:var(--ok-soft); color:var(--ok-ink)}
  .dsrow .addr{color:var(--muted); font-size:11.5px; flex:1; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; font-family:var(--fm)}
  .dsrow .act{display:flex; gap:6px; flex:none}
  .mini-btn{
    height:26px; padding:0 9px; border-radius:var(--r-ctrl); border:1px solid var(--border-s);
    background:var(--bg); font-size:11.5px; cursor:pointer; color:var(--ink2);
    font-family:inherit; transition:border-color .12s,color .12s}
  .mini-btn:hover{background:var(--panel-2); border-color:var(--brand); color:var(--brand-ink)}
  .mini-btn.del{color:var(--danger-ink); border-color:rgba(229,72,77,.28)}
  .mini-btn.del:hover{background:var(--danger-soft); border-color:var(--danger)}

  .formgrid{display:grid; grid-template-columns:120px 1fr; gap:10px 12px; align-items:center}
  .formgrid label{font-size:12.5px; color:var(--ink2); font-weight:500}
  .formgrid input,.formgrid select{
    height:34px; border:1px solid var(--border-s); border-radius:var(--r-card);
    padding:0 10px; font-size:13px; outline:none; background:var(--bg);
    font-family:inherit; width:100%; color:var(--ink); transition:border-color .12s,box-shadow .12s
  }
  .formgrid input:focus,.formgrid select:focus{
    border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
  .formgrid .full{grid-column:1 / -1}
  .formgrid .note{grid-column:2; font-size:11.5px; color:var(--muted); margin-top:-6px; line-height:1.5}
  .testbox{
    margin-top:12px; padding:10px 12px; border-radius:var(--r-card); font-size:12.3px;
    line-height:1.7; white-space:pre-wrap; word-break:break-word; display:none;
    font-family:var(--fm);
  }
  .testbox.ok{display:block; background:var(--ok-soft); border:1px solid rgba(31,146,84,.22);
    color:var(--ok-ink)}
  .testbox.err{display:block; background:var(--danger-soft);
    border:1px solid rgba(229,72,77,.24); color:var(--danger-ink)}

  /* ---------- 无数据源：引导卡 ---------- */
  .welcome{
    flex:1; min-height:0; display:none; align-items:center; justify-content:center;
    padding:40px 24px; background:var(--page);
  }
  body.nosrc .welcome{display:flex}
  body.nosrc main{display:none}
  body.nosrc .wcard{display:flex}
  .wcard{
    width:100%; max-width:460px; display:none; flex-direction:column; align-items:center;
    text-align:center; background:var(--bg); border:1px solid var(--border);
    border-radius:var(--r-shell); padding:40px 36px; box-shadow:var(--sh-pop);
  }
  .wcard .wico{
    width:46px; height:46px; border-radius:var(--r-card); background:var(--brand-soft);
    display:grid; place-items:center; color:var(--brand); font-size:20px; margin-bottom:18px;
  }
  .wcard b{font-size:15.5px; color:var(--ink); font-weight:650; letter-spacing:-.01em}
  .wcard p{margin-top:10px; font-size:12.5px; color:var(--muted); line-height:1.75}
  .wcard .wheels{display:flex; gap:10px; margin-top:22px}
  .wcard .whint{margin-top:22px; display:flex; flex-direction:column; gap:4px;
    font-family:var(--fm); font-size:11px; color:var(--muted); line-height:1.9}
  .wcard .whint b{font-size:11px; color:var(--ink2); font-weight:600}

  /* toast */
  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#E6EAF0; padding:9px 18px; border-radius:var(--r-card);
    font-size:12.8px; opacity:0; pointer-events:none; transition:all .25s; z-index:80;
    box-shadow:0 12px 30px -10px rgba(15,19,26,.44); max-width:70vw;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  /* 顶栏收窄：先把不必要的信息退掉，再缩下拉，最后才折行 */
  @media (max-width:1180px){
    header .ver{display:none}
    header .who{display:none}
    .picks select{max-width:180px}
  }
  @media (max-width:900px){
    header{gap:9px; padding:0 12px}
    header .logo .sq{display:none}
    header .logo{font-size:13.5px}
    .picks .plb{display:none}
    .picks select{max-width:150px}
    #btnPwd{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="sq">SQL</span>SQLWeb</div>
  <div class="ver" id="verLabel"></div>
  <div class="grow"></div>
  <div class="picks">
    <span class="plb">数据源</span>
    <select id="dbSelect" title="切换数据源"></select>
    <span class="pdiv"></span>
    <span class="plb">当前库</span>
    <select id="libSelect" title="切换当前库"></select>
  </div>
  <button class="hbtn" id="btnDs">数据源管理</button>
  <button class="hbtn" id="btnPwd">改密</button>
  <span class="who" id="whoLabel"></span>
  <button class="hbtn" id="btnLogout">退出</button>
</header>

<main>
  <aside>
    <div class="asec"><span>对象树<span class="cnt" id="treeCnt"></span></span><span class="mini" id="btnRefresh">刷新</span></div>
    <div class="tree" id="tree">
      <div class="treeload">正在加载…</div>
    </div>
    <div class="treefoot" id="treeFoot"></div>
  </aside>

  <section class="ws">
    <div class="bar">
      <span class="dbref" id="tagDb">—</span>
      <span class="tag ro" id="tagRo">只读</span>
      <div class="grow"></div>
      <button class="btn" id="btnClear">清空</button>
      <button class="btn run" id="btnRun">执行 (Ctrl+Enter)</button>
    </div>

    <div class="editor">
      <textarea id="sql" spellcheck="false" placeholder="SELECT * FROM ..."></textarea>
    </div>

    <div class="splitter" id="splitter"></div>

    <div class="result">
      <div class="rhead">
        <span class="stat" id="statInfo">就绪</span>
        <div class="grow"></div>
        <button class="btn" id="btnCsv" style="height:26px;font-size:11.5px;padding:0 10px">导出 CSV</button>
      </div>
      <div class="rbody" id="rbody">
        <div class="empty">
          <div>在左侧展开库与表，或直接输入 SQL</div>
          <div style="font-size:12px;color:#a3b1c6">执行快捷键：Ctrl + Enter</div>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="welcome" id="welcome">
  <div class="wcard">
    <div class="wico">▤</div>
    <b>还没有配置数据源</b>
    <p>加一个数据库连接，加完这里会自动列出它的库、schema 和表。支持 PostgreSQL、MySQL、SQL Server、Oracle、达梦、SQLite 六类。</p>
    <div class="wheels">
      <button class="btn run" id="btnDsFromWelcome">新增数据源</button>
    </div>
    <div class="whint">
      <span><b>配置写在 config.json</b> · 也可以直接改文件</span>
      <span><b>驱动没装的话</b> · 界面会告诉你要装哪一个</span>
    </div>
  </div>
</div>

<div class="modal" id="modalDs">
  <div class="box">
    <div class="mhead">
      <h3>数据源管理</h3>

<div class="modal" id="modalPwd">
  <div class="box" style="max-width:430px">
    <div class="mhead">
      <h3>修改口令</h3>

      <button class="x" id="closePwd">×</button>
    </div>
    <div class="mbody">
      <div class="formgrid">
        <label>原口令</label><input type="password" id="pwdOld" autocomplete="off">
        <label>新口令</label><input type="password" id="pwdNew" autocomplete="off">
        <label>确认新口令</label><input type="password" id="pwdNew2" autocomplete="off">

<div class="toast" id="toast"></div>
<script>
(function () {
  "use strict";
  var BASE = (window.__BASE__ || "").replace(/\/+$/, "");
  var VERSION = window.__VERSION__ || "";
  var $ = function (id) { return document.getElementById(id); };

  var state = {
    cfg: null, databases: [], drivers: [], defaultDb: "", db: "",
    databasesOfDb: [], database: "", currentDbNode: "",
    schemas: [], overview: null, expanded: {}, currentSchema: "",
    lastResult: null, editingKey: null, busy: false
  };

  function url(p) { return BASE + p; }
  function enc(s) { return encodeURIComponent(s == null ? "" : s); }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function truncate(s, n) {
    s = String(s == null ? "" : s);
    return s.length > n ? s.slice(0, n) + "…" : s;
  }
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._tm);
    t._tm = setTimeout(function () { t.classList.remove("show"); }, 2400);
  }

  function apiGet(p) {
    return fetch(url(p), { credentials: "same-origin", cache: "no-store" })
      .then(function (r) {
        if (r.status === 401) { location.href = url("/login"); return Promise.reject(new Error("未登录")); }
        return r.json();
      });
  }
  function apiPost(p, body) {
    return fetch(url(p), {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    }).then(function (r) {
      if (r.status === 401) { location.href = url("/login"); return Promise.reject(new Error("未登录")); }
      return r.json();
    });
  }
  function errMsg(d, fallback) {
    return (d && d.error && d.error.message) || fallback || "操作失败";
  }

  /* ---------------- 配置与数据源 ---------------- */
  function loadConfig() {
    return apiGet("/api/config").then(function (d) {
      if (!d.ok) throw new Error(errMsg(d, "配置加载失败"));
      state.cfg = d;
      state.databases = d.databases || [];
      state.defaultDb = d.default_db || (state.databases[0] && state.databases[0].key) || "";
      state.db = state.db || state.defaultDb;
      $("verLabel").textContent = "v" + d.version;
      $("whoLabel").textContent = d.user ? ("已登录：" + d.user) : "";
      renderDbSelect();
      renderRoTag();
      if (!state.databases.length) {
        // 一个源都没有：进引导态，而不是留一个空白工作台或弹错误
        document.body.classList.add("nosrc");
        $("tree").innerHTML = '<div class="treeload">还没有数据源</div>';
        $("treeCnt").textContent = "";
        $("treeFoot").textContent = "";
        renderLibSelect();
        return null;
      }
      document.body.classList.remove("nosrc");
      return loadTree();
    });
  }

  function currentDs() {
    var key = state.db;
    for (var i = 0; i < state.databases.length; i++) {
      if (state.databases[i].key === key) return state.databases[i];
    }
    return state.databases[0] || null;
  }

  function renderDbSelect() {
    var sel = $("dbSelect"), ds = currentDs();
    sel.innerHTML = "";
    state.databases.forEach(function (d) {
      var o = document.createElement("option");
      o.value = d.key;
      o.textContent = d.label + "  ·  " + d.driver;
      if (d.key === state.db) o.selected = true;
      sel.appendChild(o);
    });
    if (!state.databases.length) {
      // 一个源都没有时，下拉里放一句实话，别留一个空框
      var o0 = document.createElement("option");
      o0.value = "";
      o0.textContent = "未配置数据源";
      sel.appendChild(o0);
      sel.disabled = true;
    } else {
      sel.disabled = false;
    }
    $("tagDb").textContent = ds ? ds.label : "无数据源";
    $("tagDb").title = ds ? (ds.driver + " " + (ds.host || "") + " " + (ds.dbname || "")) : "";
  }

  /* 库分组的规则：系统库单列，其余按首个下划线前的前缀聚成“xx 系列”，
     没有下划线的散名归到“业务库”。刻意不预取每个库有多少张表 ——
     PG 没有廉价的“该库有多少表”接口，36 个库逐个连就是 36 次建连，
     为了一个徽标不值。 */
  function libGroupOf(name) {
    if (/^(postgres|template0|template1|master|model|msdb|tempdb)$/i.test(name)) return "系统库";
    var i = name.indexOf("_");
    if (i > 0) return name.slice(0, i) + " 系列";
    return "业务库";
  }

  function renderLibSelect() {
    var sel = $("libSelect");
    if (!sel) return;
    var libs = state.databasesOfDb || [];
    sel.innerHTML = "";
    if (!state.databases.length || !libs.length) {
      var o0 = document.createElement("option");
      o0.value = "";
      o0.textContent = state.databases.length ? "（无库可切换）" : "—";
      sel.appendChild(o0);
      sel.disabled = true;
      return;
    }
    sel.disabled = false;
    var groups = Object.create(null), keys = [];
    libs.forEach(function (l) {
      var g = libGroupOf(l);
      if (!groups[g]) { groups[g] = []; keys.push(g); }
      groups[g].push(l);
    });
    // 业务库 → 各前缀系列 → 系统库，系统库永远押在最后
    keys.sort(function (a, b) {
      if (a === "系统库") return 1;
      if (b === "系统库") return -1;
      if (a === "业务库") return -1;
      if (b === "业务库") return 1;
      return a.localeCompare(b);
    });
    keys.forEach(function (g) {
      var og = document.createElement("optgroup");
      og.label = g;
      groups[g].forEach(function (l) {
        var o = document.createElement("option");
        o.value = l;
        o.textContent = l;
        og.appendChild(o);
      });
      sel.appendChild(og);
    });
    if (state.database && libs.indexOf(state.database) >= 0) {
      sel.value = state.database;
    } else {
      state.database = sel.options[0] ? sel.options[0].value : "";
      if (state.database) sel.value = state.database;
    }
    sel.title = "当前库：" + (state.database || "—") + "（共 " + libs.length + " 个）";
  }

  function renderRoTag() {
    var ds = currentDs(), ro = ds ? ds.readonly : true;
    var el = $("tagRo");
    el.textContent = ro ? "只读" : "可写";
    el.className = "tag " + (ro ? "ro" : "rw");
  }

  /* ---------------- 对象树 ---------------- */
  function dbQuery(extra) {
    var q = "/api/overview?db=" + enc(state.db);
    if (state.database) q += "&database=" + enc(state.database);
    return q + (extra || "");
  }

  function loadTree() {
    $("tree").innerHTML = '<div class="treeload">正在加载对象…</div>';
    state.expanded = {};
    state.currentSchema = "";
    return apiGet(dbQuery()).then(function (d) {
      if (!d.ok) throw new Error(errMsg(d, "加载对象树失败"));
      state.overview = d.data || {};
      state.schemas = state.overview.schemas || [];
      state.databasesOfDb = state.overview.databases || [];
      // 首次进来没选库时，对齐到连接实际落在的那个库（dbname 留空时靠 current_database 判断）
      if (!state.database && state.databasesOfDb.length) {
        var cur = state.overview.current_database || (currentDs() || {}).dbname;
        state.database = (cur && state.databasesOfDb.indexOf(cur) >= 0) ? cur : state.databasesOfDb[0];
      }
      renderTree();
    }).catch(function (e) {
      $("tree").innerHTML = '<div class="treeload" style="color:#f87171">' + esc(e.message) + "</div>";
    });
  }

  function toggleDb(lib) {
    if (state.database === lib) {
      // 再点一次收回：回到数据源自身连接的那个库
      state.database = "";
      loadTree();
      return;
    }
    state.database = lib;
    state.expanded = {};
    state.currentSchema = "";
    $("tree").innerHTML = '<div class="treeload">正在切换库 ' + esc(lib) + " …</div>";
    apiGet(dbQuery()).then(function (d) {
      if (!d.ok) throw new Error(errMsg(d, "加载库失败"));
      state.overview = d.data || {};
      state.schemas = state.overview.schemas || [];
      state.databasesOfDb = state.overview.databases || [];
      renderTree();
    }).catch(function (e) {
      $("tree").innerHTML = '<div class="treeload" style="color:#f87171">' + esc(e.message) + "</div>";
    });
  }

  function renderTree() {
    var ov = state.overview || {}, h = [];

    // 从 depth 开始渲染 schema 层，表自动落在 depth+1
    function pushSchemas(depth) {
      if (!state.schemas.length) {
        h.push('<div class="treeload" style="padding-left:' + (depth === 1 ? 16 : 32) + 'px">（无模式）</div>');
        return;
      }
      state.schemas.forEach(function (s) {
        var node = state.expanded[s];
        var open = !!node;
        h.push('<div class="tnode depth' + depth + (state.currentSchema === s ? " active" : "") +
               '" data-schema="' + esc(s) + '">' +
               '<span class="ic">' + (open ? "▾" : "▸") + "</span>" +
               '<span class="nm" title="' + esc(s) + '">' + esc(s) + "</span></div>");
        if (!open) return;
        if (node.loading) {
          h.push('<div class="treeload" style="padding-left:' + ((depth + 1) * 16) + 'px">加载表…</div>');
          return;
        }
        var tbls = node.tables || [];
        if (!tbls.length) {
          h.push('<div class="treeload" style="padding-left:' + ((depth + 1) * 16) + 'px">（无表）</div>');
          return;
        }
        tbls.forEach(function (t) {
          h.push('<div class="tnode depth' + (depth + 1) + '" data-schema="' + esc(s) +
                 '" data-table="' + esc(t) + '">' +
                 '<span class="ic">▪</span><span class="nm" title="' + esc(t) + '">' + esc(t) + "</span></div>");
        });
      });
    }

    // 库这一层已经搬到顶栏「当前库」下拉，树里只留 schema → 表
    if (ov.database_error) {
      h.push('<div class="treeload bad">' + esc(truncate(ov.database_error, 140)) + "</div>");
    } else if (!state.schemas.length) {
      h.push('<div class="treeload">没有可显示的模式' +
             (ov.schema_error ? ('：' + esc(truncate(ov.schema_error, 120))) : "") + "</div>");
    }
    if (state.schemas.length) pushSchemas(1);
    $("tree").innerHTML = h.join("");
    // 表数是懒加载出来的，展开哪个 schema 就把它那层的数量记进来
    var tsum = 0;
    Object.keys(state.expanded || {}).forEach(function (k) {
      var nd = state.expanded[k];
      if (nd && nd.tables) tsum += nd.tables.length;
    });
    $("treeCnt").textContent = tsum ? (" · " + tsum) : "";
    // 树尾交代“这是哪台机器、哪个库”，抬头就知道自己在哪
    var foot = [];
    if (ov.server) foot.push(truncate(ov.server, 30));
    else if (ov.driver) foot.push(ov.driver);
    if (state.database) foot.push(state.database);
    $("treeFoot").textContent = foot.join("  ·  ");
    $("treeFoot").title = ov.server || "";
    renderLibSelect();
  }

  function toggleSchema(s) {
    state.currentSchema = s;
    var node = state.expanded[s];
    if (node && !node.loading && node.tables) {
      delete state.expanded[s];
      renderTree();
      return;
    }
    state.expanded[s] = { loading: true, tables: [] };
    renderTree();
    var u = "/api/tables?db=" + enc(state.db) + "&schema=" + enc(s);
    if (state.database) u += "&database=" + enc(state.database);
    apiGet(u).then(function (d) {
      if (d.ok) {
        state.expanded[s] = { loading: false, tables: d.data || [] };
      } else {
        state.expanded[s] = { loading: false, tables: [] };
        toast(errMsg(d, "加载表失败"));
      }
      renderTree();
    }).catch(function (e) {
      state.expanded[s] = { loading: false, tables: [] };
      renderTree();
      toast(e.message);
    });
  }

  function quoteIdent(s, drv) {
    if (drv === "mysql") return "`" + s + "`";
    if (drv === "sqlserver") return "[" + s + "]";
    return '"' + s + '"';
  }

  function loadColumns(schema, table) {
    $("statInfo").textContent = "正在读取表结构…";
    apiGet("/api/columns?db=" + enc(state.db) + "&schema=" + enc(schema) + "&table=" + enc(table))
      .then(function (d) {
        if (!d.ok) {
          $("statInfo").textContent = "读取失败";
          $("rbody").innerHTML = '<div class="errbox">' + esc(errMsg(d, "读取表结构失败")) + "</div>";
          return;
        }
        var rows = d.data || [];
        state.lastResult = { ok: true, columns: ["列名", "类型", "可空"], rows: rows };
        $("statInfo").innerHTML = "表 <b>" + esc(schema) + "." + esc(table) + "</b> 共 <b>" + rows.length + "</b> 列";
        renderGrid(["列名", "类型", "可空"], rows);
      });
  }

  /* ---------------- 结果渲染 ---------------- */
  function cellText(v) {
    if (v === null || v === undefined) return "";
    return String(v).replace(/\r/g, "").replace(/\n/g, " ↵ ");
  }

  function renderGrid(cols, rows) {
    // 每列数值的量级上限：按 log10 归一后给数字画一条长短条，
    // 一眼看出哪几行是大数。数字本身仍是可选中、可复制的真值。
    var maxLog = [];
    for (var j0 = 0; j0 < cols.length; j0++) maxLog[j0] = 0;
    rows.forEach(function (r) {
      for (var j1 = 0; j1 < cols.length; j1++) {
        var v0 = (r || [])[j1];
        if (typeof v0 === "number" && isFinite(v0) && v0 !== 0) {
          var l0 = Math.log10(Math.abs(v0));
          if (l0 > maxLog[j1]) maxLog[j1] = l0;
        }
      }
    });
    var h = ['<table class="grid"><thead><tr><th class="rownum">#</th>'];
    cols.forEach(function (c) { h.push("<th>" + esc(c) + "</th>"); });
    h.push("</tr></thead><tbody>");
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i] || [];
      h.push('<tr><td class="rownum">' + (i + 1) + "</td>");
      for (var j = 0; j < cols.length; j++) {
        var v = r[j];
        if (v === null || v === undefined) {
          h.push('<td class="null">NULL</td>');
        } else if (typeof v === "number") {
          var w = 0;
          if (v !== 0 && isFinite(v) && maxLog[j] > 0) {
            w = Math.max(6, Math.round((Math.log10(Math.abs(v)) / maxLog[j]) * 100));
          }
          h.push('<td class="num' + (w ? " qty" : "") + '" style="--w:' + w + '%" title="' +
                 esc(v) + '">' + esc(v) + "</td>");
        } else {
          h.push('<td title="' + esc(cellText(v)) + '">' + esc(cellText(v)) + "</td>");
        }
      }
      h.push("</tr>");
    }
    h.push("</tbody></table>");
    $("rbody").innerHTML = h.join("");
  }

  function renderResult(d) {
    state.lastResult = d;
    if (!d.ok) {
      $("statInfo").textContent = "执行失败";
      $("rbody").innerHTML = '<div class="errbox">' + esc(errMsg(d, "未知错误")) +
        (d.error && d.error.stage ? ("\n\n阶段: " + esc(d.error.stage)) : "") + "</div>";
      return;
    }
    var cols = d.columns || [], rows = d.rows || [];
    $("statInfo").innerHTML = "返回 <b>" + rows.length + "</b> 行" +
      (d.truncated ? "（已截断）" : "") + " · 耗时 <b>" + (d.elapsed_ms || 0) + "</b> ms";
    if (!cols.length) {
      var n = (d.statements || []).length;
      $("rbody").innerHTML = '<div class="infobox">语句执行成功（' + n + " 条语句，无结果集）</div>";
      return;
    }
    renderGrid(cols, rows);
  }

  function runSql() {
    if (state.busy) return;
    var sql = $("sql").value.trim();
    if (!sql) { toast("SQL 为空"); return; }
    if (!state.db) { toast("请先添加并选择数据源"); return; }
    state.busy = true;
    $("btnRun").disabled = true;
    $("statInfo").textContent = "执行中…";
    $("rbody").innerHTML = '<div class="empty">查询执行中，请稍候…</div>';
    apiPost("/api/query", {
      db: state.db, sql: sql,
      schema: state.currentSchema || undefined,
      database: state.database || undefined
    }).then(function (d) {
      renderResult(d);
    }).catch(function (e) {
      $("statInfo").textContent = "执行失败";
      $("rbody").innerHTML = '<div class="errbox">' + esc(e.message) + "</div>";
    }).then(function () {
      state.busy = false;
      $("btnRun").disabled = false;
    });
  }

  function csvCell(v) {
    if (v === null || v === undefined) return "";
    var s = String(v);
    if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function exportCsv() {
    var d = state.lastResult;
    if (!d || !d.ok || !d.columns || !d.columns.length) { toast("没有可导出的结果集"); return; }
    var lines = [d.columns.map(csvCell).join(",")];
    (d.rows || []).forEach(function (r) {
      lines.push((r || []).map(csvCell).join(","));
    });
    var blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "sqlweb_" + state.db + "_" + Date.now() + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
    toast("已导出 " + (d.rows || []).length + " 行");
  }

  /* ---------------- 数据源管理弹窗 ---------------- */
  function openDs() {
    $("modalDs").classList.add("show");
    state.editingKey = null;
    var need = state.drivers.length ? Promise.resolve() : apiGet("/api/drivers").then(function (d) {
      if (d.ok) state.drivers = d.data || [];
    });
    need.then(function () {
      renderDsList();
      renderDsForm(null);
    });
  }

  function closeDs() {
    $("modalDs").classList.remove("show");
  }

  function renderDsList() {
    var h = ['<div class="dslist">'];
    if (!state.databases.length) {
      h.push('<div class="dsrow"><span class="addr">还没有数据源，点下方「新增数据源」</span></div>');
    }
    state.databases.forEach(function (d) {
      var addr;
      if (d.driver === "sqlite") {
        addr = d.path || d.dbname || "";
      } else {
        addr = (d.host || "") + ":" + (d.port || "") + (d.dbname ? ("/" + d.dbname) : "");
      }
      h.push('<div class="dsrow">');
      h.push('<span class="nm">' + esc(d.label) + "</span>");
      h.push('<span class="badge">' + esc(d.driver) + "</span>");
      h.push('<span class="badge ' + (d.readonly ? "ro" : "") + '">' + (d.readonly ? "只读" : "可写") + "</span>");
      if (d.key === state.defaultDb) h.push('<span class="badge ro">默认</span>');
      h.push('<span class="addr" title="' + esc(addr) + '">' + esc(addr) + "</span>");
      h.push('<div class="act">');
      if (d.key !== state.defaultDb) {
        h.push('<button class="mini-btn" data-act="def" data-key="' + esc(d.key) + '">设默认</button>');
      }
      h.push('<button class="mini-btn" data-act="edit" data-key="' + esc(d.key) + '">编辑</button>');
      h.push('<button class="mini-btn del" data-act="del" data-key="' + esc(d.key) + '">删除</button>');
      h.push("</div></div>");
    });
    h.push("</div>");
    $("dsBody").innerHTML = h.join("");
  }

  function driverOf(name) {
    for (var i = 0; i < state.drivers.length; i++) {
      if (state.drivers[i].name === name) return state.drivers[i];
    }
    return null;
  }

  function renderDsForm(ds) {
    var wrap = $("dsFormWrap");
    if (!wrap) return;
    var isEdit = !!ds;
    var d = ds || { driver: "postgresql", port: 5432, readonly: true };
    var drv = driverOf(d.driver) || { name: "postgresql", default_port: 5432, available: false, info: "" };

    var opts = state.drivers.map(function (x) {
      return '<option value="' + esc(x.name) + '"' + (x.name === d.driver ? " selected" : "") + ">" +
        esc(x.label) + " — " + (x.available ? "可用" : "驱动缺失") + "</option>";
    }).join("");

    var h = ['<div style="border-top:1px solid #e2e8f0;padding-top:14px">'];
    h.push('<div style="font-size:13px;font-weight:650;margin-bottom:12px">' +
           (isEdit ? ("编辑：" + esc(d.label)) : "新增数据源") + "</div>");
    h.push('<div class="formgrid">');

    h.push("<label>名称</label><input id=" + '"fLabel"' + ' value="' + esc(d.label || "") + '" placeholder="如：生产 PG">');

    h.push("<label>数据库类型</label><select id=" + '"fDriver"' + ">" + opts + "</select>");
    h.push('<div class="note" id="fDrvNote">' + esc(drv.info || "") + "</div>");

    h.push("<label>主机地址</label><input id=" + '"fHost"' + ' value="' + esc(d.host || "") + '" placeholder="IP 或域名">');

    h.push("<label>端口</label><input id=" + '"fPort"' + ' value="' + esc(d.port == null ? "" : d.port) + '">');

    h.push("<label>用户名</label><input id=" + '"fUser"' + ' value="' + esc(d.user || "") + '" autocomplete="off">');

    h.push("<label>口令</label><input id=" + '"fPasswd"' + ' type="password" value="" autocomplete="new-password" placeholder="' +
           (isEdit ? "留空则不修改" : "") + '">');

    h.push('<label id="fDbNameLabel">库名 / 服务名</label><input id="' + 'fDbname" value="' + esc(d.dbname || "") +
           '" placeholder="Oracle 填 SID/Service，SQLServer 填库名">');

    h.push('<label id="fPathLabel">文件路径</label><input id="' + 'fPath" value="' + esc(d.path || "") +
           '" placeholder="SQLite 数据库文件的绝对路径">');

    h.push("<label>访问模式</label>");
    h.push('<div><select id="' + 'fReadonly"><option value="1"' + (d.readonly ? " selected" : "") +
           '>只读（拦截 INSERT/UPDATE/DELETE/DDL）</option><option value="0"' + (d.readonly ? "" : " selected") +
           ">可写（允许全部语句）</option></select></div>");

    h.push("</div>");
    h.push('<div class="testbox" id="dsTestBox"></div>');
    h.push('<div style="margin-top:14px;display:flex;gap:8px">');
    h.push('<button class="btn" id="btnTestConn">测试连接</button>');
    h.push('<button class="btn run" id="btnSaveDs">保存数据源</button>');
    h.push('<button class="btn" id="btnCancelDs">取消</button>');
    h.push("</div>");
    h.push("</div>");
    wrap.innerHTML = h.join("");

    bindFormEvents();
    syncFormFields();
  }

  function fb(v) {
    var el = document.getElementById(v);
    return el ? el.value : "";
  }

  function collectDs() {
    var driver = fb("fDriver");
    var readonly = fb("fReadonly") === "1";
    var ds = {
      label: fb("fLabel").trim(),
      driver: driver,
      host: fb("fHost").trim(),
      port: fb("fPort").trim(),
      user: fb("fUser").trim(),
      dbname: fb("fDbname").trim(),
      path: fb("fPath").trim(),
      readonly: readonly
    };
    var pwd = document.getElementById("fPasswd");
    if (pwd && pwd.value) ds.password = pwd.value;
    if (state.editingKey) ds.key = state.editingKey;
    if (driver === "sqlite") {
      ds.dbname = ds.path;
      ds.host = "";
      ds.port = "";
    }
    return ds;
  }

  function syncFormFields() {
    var driver = fb("fDriver");
    var isSql = driver === "sqlite";
    var isOracle = driver === "oracle";
    $("fPathLabel").style.display = isSql ? "" : "none";
    $("fPath").style.display = isSql ? "" : "none";
    $("fHost").parentNode.style.display = "";

    var hostLabel = $("fHost").previousElementSibling;
    var portInput = $("fPort");
    var note = $("fDrvNote");
    var drv = driverOf(driver);

    if (isSql) {
      hostLabel.style.display = "none";
      $("fHost").style.display = "none";
      portInput.style.display = "none";
      portInput.previousElementSibling && (portInput.previousElementSibling.style.display = "none");
      $("fDbNameLabel").style.display = "none";
      $("fDbname").style.display = "none";
      $("fUser").style.display = "none";
      $("fUser").previousElementSibling.style.display = "none";
      $("fPasswd").style.display = "none";
      $("fPasswd").previousElementSibling.style.display = "none";
    } else {
      hostLabel.style.display = "";
      $("fHost").style.display = "";
      portInput.style.display = "";
      portInput.previousElementSibling && (portInput.previousElementSibling.style.display = "");
      $("fDbNameLabel").style.display = "";
      $("fDbname").style.display = "";
      $("fUser").style.display = "";
      $("fUser").previousElementSibling.style.display = "";
      $("fPasswd").style.display = "";
      $("fPasswd").previousElementSibling.style.display = "";
      $("fDbNameLabel").textContent = isOracle ? "服务名 / SID" : "库名";
    }
    if (drv) {
      note.textContent = drv.info || "";
      note.style.color = drv.available ? "#15803d" : "#b91c1c";
    }
    if (!isSql && !fb("fPort") && drv && drv.default_port) {
      $("fPort").value = drv.default_port;
    }
  }

  function bindFormEvents() {
    $("fDriver").addEventListener("change", function () {
      var drv = driverOf($("fDriver").value);
      if (drv && drv.default_port !== null && drv.default_port !== undefined) {
        $("fPort").value = drv.default_port;
      }
      syncFormFields();
    });
  }

  function testConnection() {
    var box = $("dsTestBox");
    var ds = collectDs();
    if (!ds.label) { toast("请先填写名称"); return; }
    if (ds.driver !== "sqlite" && !ds.host) { toast("请填写主机地址"); return; }
    box.className = "testbox";
    box.textContent = "正在测试连接…";
    box.style.display = "block";
    box.style.background = "#f1f5f9";
    box.style.border = "1px solid #e2e8f0";
    box.style.color = "#475569";
    apiPost("/api/ds/test", { ds: ds }).then(function (d) {
      if (d.ok) {
        box.className = "testbox ok";
        box.textContent = "连接成功（" + (d.elapsed_ms || 0) + " ms）\n" +
          "服务端版本: " + (d.server || "—") + "\n" +
          "驱动: " + (d.module || "—") + "\n" +
          "可见库/模式: " + ((d.schemas || []).slice(0, 12).join(", ") || "—");
      } else {
        box.className = "testbox err";
        box.textContent = "连接失败\n" + errMsg(d, "未知错误");
      }
    }).catch(function (e) {
      box.className = "testbox err";
      box.textContent = "请求失败\n" + e.message;
    });
  }

  function saveDs() {
    var ds = collectDs();
    if (!ds.label) { toast("请填写名称"); return; }
    if (ds.driver !== "sqlite" && !ds.host) { toast("请填写主机地址"); return; }
    apiPost("/api/ds/save", { ds: ds }).then(function (d) {
      if (!d.ok) { toast(errMsg(d, "保存失败")); return; }
      toast("已保存，正在刷新…");
      return loadDatabases().then(function () {
        state.editingKey = null;
        renderDsList();
        renderDsForm(null);
      });
    }).catch(function (e) { toast(e.message); });
  }

  function loadDatabases() {
    return apiGet("/api/config").then(function (d) {
      if (!d.ok) return;
      state.databases = d.databases || [];
      state.defaultDb = d.default_db || state.defaultDb;
      if (!state.db && state.databases.length) state.db = state.databases[0].key;
      var still = false;
      state.databases.forEach(function (x) { if (x.key === state.db) still = true; });
      if (!still) {
        state.db = state.defaultDb || (state.databases[0] && state.databases[0].key) || "";
        state.database = "";
        state.databasesOfDb = [];
        state.schemas = [];
        state.expanded = {};
        state.currentSchema = "";
      }
      renderDbSelect();
      renderRoTag();
      return loadTree();
    });
  }

  /* ---------------- 绑定 ---------------- */
  $("dbSelect").addEventListener("change", function () {
    state.db = this.value;
    // 换数据源后库/模式选择全部归零，否则会拿旧库的名字去新源上查
    state.database = "";
    state.databasesOfDb = [];
    state.schemas = [];
    state.expanded = {};
    state.currentSchema = "";
    renderDbSelect();   // 顺带更新编辑区左上角的源标签（原来只刷了"只读"标签，标签会停在旧源）
    renderRoTag();
    loadTree();
  });

  // 顶栏「当前库」下拉：换库只是临时换连接去读，不写回 config.json
  $("libSelect").addEventListener("change", function () {
    var v = this.value;
    if (!v || v === state.database) return;
    state.database = v;
    state.schemas = [];
    state.expanded = {};
    state.currentSchema = "";
    $("tree").innerHTML = '<div class="treeload">正在切换库 ' + esc(v) + " …</div>";
    loadTree();
  });
  $("btnRefresh").addEventListener("click", function () { loadTree(); });

  $("tree").addEventListener("click", function (ev) {
    var el = ev.target;
    while (el && el !== this) {
      if (el.classList && el.classList.contains("tnode")) break;
      el = el.parentNode;
    }
    if (!el || el === this) return;
    var lib = el.getAttribute("data-lib");
    var sch = el.getAttribute("data-schema");
    var tbl = el.getAttribute("data-table");
    if (lib) {
      toggleDb(lib);
      return;
    }
    if (tbl) {
      state.currentSchema = sch;
      loadColumns(sch, tbl);
      return;
    }
    if (sch) toggleSchema(sch);
  });

  $("tree").addEventListener("dblclick", function (ev) {
    var el = ev.target;
    while (el && el !== this) {
      if (el.classList && el.classList.contains("tnode")) break;
      el = el.parentNode;
    }
    if (!el || el === this) return;
    var sch = el.getAttribute("data-schema");
    var tbl = el.getAttribute("data-table");
    if (!tbl) return;
    var ds = currentDs();
    var q = quoteIdent(sch, ds && ds.driver) + "." + quoteIdent(tbl, ds && ds.driver);
    var sql = "SELECT * FROM " + q + " LIMIT 100;";
    $("sql").value = sql;
    state.currentSchema = sch;
    runSql();
  });

  $("btnRun").addEventListener("click", runSql);
  $("btnClear").addEventListener("click", function () {
    $("sql").value = "";
    $("rbody").innerHTML = '<div class="empty">已清空</div>';
    $("statInfo").textContent = "就绪";
    state.lastResult = null;
  });
  $("btnCsv").addEventListener("click", exportCsv);

  $("sql").addEventListener("keydown", function (ev) {
    if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") {
      ev.preventDefault();
      runSql();
    }
  });

  $("btnDs").addEventListener("click", openDs);
  $("btnDsClose").addEventListener("click", closeDs);
  $("closeDs").addEventListener("click", closeDs);
  $("btnDsNew").addEventListener("click", function () {
    state.editingKey = null;
    renderDsForm(null);
  });
  $("btnDsFromWelcome").addEventListener("click", function () { openDs(); });

  $("modalDs").addEventListener("click", function (ev) {
    if (ev.target === this) return;
  });

  /* 数据源操作按钮 */
  $("dsBody").addEventListener("click", function (ev) {
    var t = ev.target;
    if (!t.classList || !t.classList.contains("mini-btn")) return;
    var act = t.getAttribute("data-act");
    var key = t.getAttribute("data-key");
    var ds = null;
    state.databases.forEach(function (x) { if (x.key === key) ds = x; });

    if (act === "def") {
      apiPost("/api/ds/default", { key: key }).then(function (d) {
        if (!d.ok) { toast(errMsg(d, "设置失败")); return; }
        toast("已设为默认");
        return loadDatabases().then(function () { renderDsList(); });
      }).catch(function (e) { toast(e.message); });
    } else if (act === "edit") {
      state.editingKey = key;
      renderDsForm(ds);
    } else if (act === "del") {
      if (!confirm("确认删除数据源「" + (ds ? ds.label : key) + "」？")) return;
      apiPost("/api/ds/delete", { key: key }).then(function (d) {
        if (!d.ok) { toast(errMsg(d, "删除失败")); return; }
        toast("已删除");
        return loadDatabases().then(function () {
          state.editingKey = null;
          renderDsList();
          renderDsForm(null);
        });
      }).catch(function (e) { toast(e.message); });
    }
  });

  /* 表单底部按钮动态插入 */
  document.addEventListener("click", function (ev) {
    var id = ev.target && ev.target.id;
    if (id === "btnTestConn") testConnection();
    if (id === "btnSaveDs") saveDs();
    if (id === "btnCancelDs") {
      state.editingKey = null;
      renderDsForm(null);
    }
  });

  /* 改密 */
  function openPwd() {
    $("pwdOld").value = ""; $("pwdNew").value = ""; $("pwdNew2").value = "";
    $("pwdMsg").className = "testbox";
    $("modalPwd").classList.add("show");
    setTimeout(function () { $("pwdOld").focus(); }, 80);
  }
  $("btnPwd").addEventListener("click", openPwd);
  $("closePwd").addEventListener("click", function () { $("modalPwd").classList.remove("show"); });
  $("btnPwdCancel").addEventListener("click", function () { $("modalPwd").classList.remove("show"); });
  $("btnPwdSave").addEventListener("click", function () {
    var oldp = $("pwdOld").value, np = $("pwdNew").value, np2 = $("pwdNew2").value;
    var box = $("pwdMsg");
    if (!oldp) { box.className = "testbox err"; box.textContent = "请填写原口令"; return; }
    if (np.length < 8) { box.className = "testbox err"; box.textContent = "新口令至少 8 位"; return; }
    if (np !== np2) { box.className = "testbox err"; box.textContent = "两次输入不一致"; return; }
    apiPost("/api/password", { old: oldp, "new": np }).then(function (d) {
      if (!d.ok) { box.className = "testbox err"; box.textContent = errMsg(d, "修改失败"); return; }
      box.className = "testbox ok";
      box.textContent = "口令已修改，2 秒后返回登录页";
      setTimeout(function () { location.href = url("/login"); }, 2000);
    }).catch(function (e) {
      box.className = "testbox err";
      box.textContent = e.message;
    });
  });

  /* 退出 */
  $("btnLogout").addEventListener("click", function () {
    apiPost("/api/logout", {}).then(function () {
      location.href = url("/login");
    }).catch(function () { location.href = url("/login"); });
  });

  /* 分隔条拖拽 */
  (function () {
    var sp = $("splitter"), ed = document.querySelector(".editor");
    var dragging = false;
    sp.addEventListener("mousedown", function (e) { dragging = true; e.preventDefault(); });
    window.addEventListener("mousemove", function (e) {
      if (!dragging) return;
      var top = ed.getBoundingClientRect().top;
      var h = e.clientY - top;
      if (h < 70) h = 70;
      var max = window.innerHeight - top - 140;
      if (h > max) h = max;
      ed.style.height = h + "px";
    });
    window.addEventListener("mouseup", function () { dragging = false; });
  })();

  /* 启动 */
  loadConfig().catch(function (e) { toast(e.message); });
})();
</script>
</body>
</html>
