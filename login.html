<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>登录 · SQLWeb</title>
<style>
  :root{
    --bg1:#0b1220; --bg2:#152238; --card:#ffffff; --ink:#0f172a;
    --muted:#64748b; --line:#e2e8f0; --brand:#2563eb; --brand2:#1d4ed8;
    --danger:#dc2626; --ok:#16a34a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
    "Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 20% 10%,#1e3a8a33,transparent 60%),
               linear-gradient(135deg,var(--bg1),var(--bg2));
    color:var(--ink); display:flex; align-items:center; justify-content:center;
    padding:24px; min-height:100%;
  }
  .wrap{width:100%; max-width:420px}
  .brand{text-align:center; margin-bottom:22px}
  .brand h1{color:#e2e8f0; font-size:20px; font-weight:600; letter-spacing:.5px; margin:0}
  .brand p{color:#94a3b8; font-size:12.5px; margin:6px 0 0}
  .card{
    background:var(--card); border-radius:16px; padding:26px 26px 22px;
    box-shadow:0 20px 50px -12px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  }
  .card h2{font-size:17px; margin:0 0 4px; font-weight:600}
  .card .sub{font-size:12.5px; color:var(--muted); margin:0 0 18px}
  label{display:block; font-size:12.5px; color:#334155; font-weight:500; margin:14px 0 6px}
  input[type=text],input[type=password]{
    width:100%; height:42px; padding:0 12px; font-size:14px; color:var(--ink);
    background:#f8fafc; border:1px solid var(--line); border-radius:9px; outline:none;
    transition:border-color .15s, box-shadow .15s, background .15s;
    font-family:inherit;
  }
  input:focus{background:#fff; border-color:var(--brand); box-shadow:0 0 0 3px #2563eb1f}
  .cap-row{display:flex; gap:10px; align-items:stretch; margin-top:6px}
  .cap-row input{flex:1}
  .cap-img{
    width:132px; height:42px; border-radius:9px; border:1px solid var(--line);
    cursor:pointer; object-fit:cover; background:#f1f5f9; flex:none;
    transition:opacity .15s;
  }
  .cap-img:active{opacity:.7}
  .hint{font-size:11.5px; color:var(--muted); margin-top:6px; line-height:1.5}
  button.primary{
    width:100%; height:44px; margin-top:20px; border:0; border-radius:10px;
    background:linear-gradient(180deg,var(--brand),var(--brand2)); color:#fff;
    font-size:14.5px; font-weight:600; cursor:pointer; letter-spacing:.3px;
    box-shadow:0 8px 18px -8px #2563eb88; transition:transform .1s, filter .15s;
    font-family:inherit;
  }
  button.primary:hover{filter:brightness(1.06)}
  button.primary:active{transform:translateY(1px)}
  button.primary:disabled{opacity:.6; cursor:not-allowed; transform:none}
  .msg{margin-top:14px; font-size:12.8px; border-radius:8px; padding:9px 11px; display:none; line-height:1.5}
  .msg.err{display:block; background:#fef2f2; color:#b91c1c; border:1px solid #fecaca}
  .msg.ok{display:block; background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0}
  .foot{margin-top:18px; font-size:11.5px; color:#94a3b8; text-align:center; line-height:1.7}
  .token-box{
    margin-top:14px; padding:10px 12px; background:#f1f5f9; border:1px dashed #cbd5e1;
    border-radius:8px; font-size:12px; color:#475569; line-height:1.7; display:none;
  }
  .token-box b{color:#0f172a; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:15px; letter-spacing:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>SQLWeb 离线控制台</h1>
    <p>通用版 · 多数据库 · 强制登录</p>
  </div>

  <div class="card">
    <h2 id="cardTitle">登录</h2>
    <p class="sub" id="cardSub">请输入管理员账号与口令</p>

    <form id="form" autocomplete="off">
      <label>用户名</label>
      <input type="text" id="username" autocomplete="username" placeholder="管理员账号">

      <label>口令</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="至少 8 位">

      <div id="confirmWrap" style="display:none">
        <label>确认口令</label>
        <input type="password" id="password2" autocomplete="new-password" placeholder="再次输入口令">
      </div>

      <div id="tokenWrap" style="display:none">
        <label>初始化令牌</label>
        <input type="text" id="initToken" autocomplete="off" placeholder="启动日志里打印的 6 位数字">
        <div class="token-box">
          首次启动时，控制台会打印 <b>初始化令牌</b>。<br>
          它只在本次启动有效，用于防止被他人抢先设置管理员口令。
        </div>
      </div>

      <div id="captchaWrap">
        <label>验证码</label>
        <div class="cap-row">
          <input type="text" id="captcha" autocomplete="off" maxlength="4"
                 placeholder="4 位数字" inputmode="numeric">
          <img class="cap-img" id="capImg" alt="验证码" title="点击刷新">
        </div>
      </div>

      <button class="primary" id="submitBtn" type="submit">登录</button>
    </form>

    <div class="msg" id="msg"></div>
  </div>

  <div class="foot">
    口令错误与账号错误返回同一提示，不暴露账号是否存在<br>
    会话闲置 30 分钟自动失效
  </div>
</div>

<script>
(function () {
  var BASE = (window.__BASE__ || "").replace(/\/+$/, "");
  var VERSION = window.__VERSION__ || "";
  var state = { initialized: true, loggedIn: false, captchaId: null, busy: false };

  var $ = function (id) { return document.getElementById(id); };
  var msgEl = $("msg"), btn = $("submitBtn");

  function url(p) { return BASE + p; }

  function showMsg(text, kind) {
    msgEl.className = "msg " + (kind || "err");
    msgEl.textContent = text;
  }
  function clearMsg() { msgEl.className = "msg"; msgEl.textContent = ""; }

  function loadCaptcha() {
    return fetch(url("/api/captcha"), { credentials: "same-origin", cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.ok) throw new Error((d && d.error && d.error.message) || "验证码获取失败");
        state.captchaId = d.id;
        $("capImg").src = d.image;
      })
      .catch(function (e) {
        showMsg("验证码加载失败：" + e.message + "，点击图片重试");
      });
  }

  function setMode(mode) {
    var isSetup = (mode === "setup");
    $("cardTitle").textContent = isSetup ? "首次初始化" : "登录";
    $("cardSub").textContent = isSetup
      ? "服务尚未设置管理员，请先完成初始化"
      : "请输入管理员账号与口令";
    $("confirmWrap").style.display = isSetup ? "" : "none";
    $("tokenWrap").style.display = isSetup ? "" : "none";
    $("captchaWrap").style.display = isSetup ? "none" : "";
    btn.textContent = isSetup ? "完成初始化" : "登录";
    if (!isSetup) loadCaptcha();
    setTimeout(function () { $("username").focus(); }, 80);
  }

  function detect() {
    return fetch(url("/api/session"), { credentials: "same-origin", cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        state.initialized = !!d.initialized;
        state.loggedIn = !!d.logged_in;
        if (d.title) document.title = "登录 · " + d.title;
        if (state.loggedIn) {
          location.href = url("/");
          return;
        }
        setMode(state.initialized ? "login" : "setup");
      })
      .catch(function (e) {
        showMsg("无法连接服务：" + e.message);
      });
  }

  function submitLogin(body) {
    return fetch(url("/api/login"), {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); });
  }

  function submitSetup(body) {
    return fetch(url("/api/setup"), {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); });
  }

  $("capImg").addEventListener("click", function () { clearMsg(); loadCaptcha(); });

  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (state.busy) return;
    clearMsg();

    var user = $("username").value.trim();
    var pwd = $("password").value;
    if (!user) { showMsg("请填写用户名"); return; }
    if (!pwd) { showMsg("请填写口令"); return; }

    state.busy = true;
    btn.disabled = true;

    var done = function () { state.busy = false; btn.disabled = false; };

    if (!state.initialized) {
      var pwd2 = $("password2").value;
      var token = $("initToken").value.trim();
      if (pwd.length < 8) { showMsg("口令至少 8 位"); done(); return; }
      if (pwd !== pwd2) { showMsg("两次输入的口令不一致"); done(); return; }
      if (!token) { showMsg("请填写启动日志里的初始化令牌"); done(); return; }

      submitSetup({ username: user, password: pwd, token: token }).then(function (d) {
        done();
        if (d.ok) {
          showMsg("初始化完成，正在进入登录…", "ok");
          state.initialized = true;
          setTimeout(function () { setMode("login"); }, 600);
        } else {
          showMsg((d.error && d.error.message) || "初始化失败");
        }
      }).catch(function (e) { done(); showMsg("初始化请求失败：" + e.message); });
      return;
    }

    var cap = $("captcha").value.trim();
    if (!cap) { showMsg("请填写验证码"); done(); return; }

    submitLogin({
      username: user, password: pwd,
      captcha_id: state.captchaId, captcha: cap
    }).then(function (d) {
      done();
      if (d.ok) {
        showMsg("登录成功，正在进入…", "ok");
        setTimeout(function () { location.href = url("/"); }, 300);
      } else {
        showMsg((d.error && d.error.message) || "登录失败");
        $("captcha").value = "";
        loadCaptcha();
      }
    }).catch(function (e) { done(); showMsg("登录请求失败：" + e.message); loadCaptcha(); });
  });

  detect();
})();
</script>
</body>
</html>
